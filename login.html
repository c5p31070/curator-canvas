<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - curator-canvas</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="auth-kicker">CURATOR CANVAS</p>
        <h1>サインイン</h1>
        <p class="auth-intro">展覧会チームから招待されたアカウントでログインしてください。</p>

        <form id="loginForm" class="auth-form">
            <label for="loginEmail">メールアドレス</label>
            <input id="loginEmail" type="email" autocomplete="username" required>
            <label for="loginPassword">パスワード</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required>
            <button class="btn-start" type="submit">ログイン</button>
        </form>

        <form id="invitePasswordForm" class="auth-form" hidden>
            <label for="invitePassword">新しいパスワード</label>
            <input id="invitePassword" type="password" minlength="8" autocomplete="new-password" required>
            <label for="invitePasswordConfirm">パスワード（確認）</label>
            <input id="invitePasswordConfirm" type="password" minlength="8" autocomplete="new-password" required>
            <button class="btn-start" type="submit">設定して続ける</button>
        </form>
        <p id="authStatus" class="auth-status" role="status"></p>
        <a class="auth-back" href="index.html">トップへ戻る</a>
    </main>
</body>
</html>
