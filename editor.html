<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>展示配置 - Curator・Canvas</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>Curator・Canvas</h1>
  </header>

  <main>
    <h2>展示配置図作成</h2>

    <div class="scale-form">

  <label>
    1cmあたりの表示：
    <input type="number" id="scale" value="1" step="0.1">
    px
  </label>

</div>

    <div id="canvas">
      <div class="artwork">
  作品A
</div>
    </div>

    <div class="artwork-form">

  <label>
    作品名：
    <input type="text" id="artworkName" placeholder="作品名を入力">
  </label>

  <label>
    幅：
    <input type="number" id="artworkWidth" placeholder="cm">
  </label>

  <label>
    高さ：
    <input type="number" id="artworkHeight" placeholder="cm">
  </label>

  <button id="addArtwork">展示品を追加</button>

</div>
  </main>

<script src="js/editor.js"></script>

</body>

</html>
