<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>curator-canvas - 展示配置シミュレーター</title>
    <!-- Google Fonts (Noto Sans JP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script>
        // Supabase Auth emails can fall back to the Site URL (/). Forward auth
        // callbacks to the page that initializes Supabase, preserving tokens.
        (() => {
            const query = new URLSearchParams(window.location.search);
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const isAuthCallback = query.has('code') || query.has('token_hash') ||
                fragment.has('access_token') || fragment.has('refresh_token') ||
                fragment.has('token_hash') || ['invite', 'recovery'].includes(query.get('type')) ||
                ['invite', 'recovery'].includes(fragment.get('type')) ||
                fragment.has('error_code');
            if (isAuthCallback) {
                const loginUrl = new URL('login.html', window.location.href);
                loginUrl.search = window.location.search;
                loginUrl.hash = window.location.hash;
                window.location.replace(loginUrl.toString());
            }
        })();
    </script>
</head>
<body>

    <main class="container">
        <p class="subtitle">展示企画・レイアウトツール</p>
        <h1 class="title">curator-canvas</h1>
        <p class="description">
            展示室のレイアウト設計、作品配置、および混雑シミュレーションを行うWebアプリケーションです。
        </p>
        <a href="login.html" class="btn-start">ログインして配置図を開く</a>
    </main>

</body>
</html>
