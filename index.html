<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator-Canvas - 展示配置シミュレーター</title>
    <link rel="stylesheet" href="css/entry.css">
    <script>
        // Supabase Auth emails can fall back to the Site URL (/). Forward auth
        // callbacks to the page that initializes Supabase, preserving tokens.
        (() => {
            const query = new URLSearchParams(window.location.search);
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const isAuthCallback = query.has('code') || query.has('token_hash') ||
                fragment.has('access_token') || fragment.has('refresh_token') ||
                fragment.has('token_hash') || ['invite', 'recovery'].includes(query.get('type')) ||
                ['invite', 'recovery'].includes(fragment.get('type')) ||
                fragment.has('error_code');
            if (isAuthCallback) {
                const loginUrl = new URL('login.html', window.location.href);
                loginUrl.search = window.location.search;
                loginUrl.hash = window.location.hash;
                window.location.replace(loginUrl.toString());
            }
        })();
    </script>
</head>
<body class="entry-page">
    <header class="entry-header">
        <a class="entry-brand" href="index.html">Curator-Canvas <span>東京都美術館配置図アプリ</span></a>
    </header>

    <main class="entry-main entry-home">
        <div class="entry-home-content">
            <p class="entry-kicker">展覧会配置図作成アプリ</p>
            <h1>Curator-Canvas</h1>
            <a href="login.html" class="btn-start">ログインして配置図を開く <span aria-hidden="true">→</span></a>
        </div>
        <svg class="entry-plan-decoration" viewBox="0 0 280 220" fill="none" aria-hidden="true">
            <defs>
                <pattern id="entryPlanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M20 0H0V20" stroke="#32383b" stroke-width="0.6"/>
                </pattern>
            </defs>
            <path fill="url(#entryPlanGrid)" d="M0 0h280v220H0z"/>
            <g stroke="#69767d" stroke-width="2">
                <path d="M30 160V30h220v150h-70m-45 0H30v-20M30 110h65m35 0h50V30m0 80h70"/>
            </g>
            <g stroke="#8cabb7" fill="#45616c" stroke-width="1">
                <path d="M50 36h38v5H50zM111 36h38v5h-38zM36 55h5v30h-5zM202 36h28v5h-28zM239 62h5v29h-5z"/>
                <path d="M68 143h24v17H68zM206 143h20v20h-20z"/>
            </g>
            <path d="M156 196v-43h-24v-10" stroke="#aa955f" stroke-width="1" stroke-dasharray="4 4"/>
            <path d="m128 148 4-5 4 5" stroke="#aa955f" stroke-width="1"/>
            <g stroke="#515d64" stroke-width="0.7">
                <path d="M30 14h220M30 10v8m220-8v8M264 30v150m-4-150h8m-8 150h8"/>
            </g>
            <path d="M0 12V0h12M268 220h12v-12" stroke="#88535c" stroke-width="1"/>
        </svg>
    </main>

</body>
</html>
