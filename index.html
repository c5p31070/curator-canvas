<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator-Canvas - 展示配置シミュレーター</title>
    <link rel="stylesheet" href="css/entry.css">
    <script>
        // Supabase Auth emails can fall back to the Site URL (/). Forward auth
        // callbacks to the page that initializes Supabase, preserving tokens.
        (() => {
            const query = new URLSearchParams(window.location.search);
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const isAuthCallback = query.has('code') || query.has('token_hash') ||
                fragment.has('access_token') || fragment.has('refresh_token') ||
                fragment.has('token_hash') || ['invite', 'recovery'].includes(query.get('type')) ||
                ['invite', 'recovery'].includes(fragment.get('type')) ||
                fragment.has('error_code');
            if (isAuthCallback) {
                const loginUrl = new URL('login.html', window.location.href);
                loginUrl.search = window.location.search;
                loginUrl.hash = window.location.hash;
                window.location.replace(loginUrl.toString());
            }
        })();
    </script>
</head>
<body class="entry-page">
    <header class="entry-header">
        <a class="entry-brand" href="index.html">Curator-Canvas <span>東京都美術館配置図アプリ</span></a>
    </header>

    <main class="entry-main entry-home">
        <p class="entry-kicker">展示企画・レイアウトツール</p>
        <h1>展示配置ワークスペース</h1>
        <p class="entry-intro">平面図・壁面図を使った作品配置と、照明・混雑予想の検討をチームで行います。</p>
        <div class="entry-features" aria-label="主な機能">
            <span>平面図・壁面図</span><span>照明・混雑予想</span><span>保存・チーム共有</span>
        </div>
        <a href="login.html" class="btn-start">ログインして配置図を開く <span aria-hidden="true">→</span></a>
    </main>

</body>
</html>
